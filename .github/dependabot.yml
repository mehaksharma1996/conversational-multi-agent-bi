version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
  # Digest-pinned base images in Dockerfile.api and Dockerfile.web (matched by name). A digest
  # bump must pass the containers CI job before merge; see docs/operations/local-containers.md.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # Digest and patch updates of the pinned tags are welcome. Moving the toolchain itself (Node and
    # Python major/minor) is a coordinated change across .nvmrc, package.json "engines",
    # pyproject.toml, requirements.lock, the CI matrix, and the Dockerfiles, so it is done by hand.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
