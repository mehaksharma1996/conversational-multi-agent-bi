name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify generated API client
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Frontend lint
        run: npm run lint
      - name: Frontend type check
        run: npm run typecheck
      - name: Frontend unit tests
        run: npm run test
      - name: Frontend production build
        run: npm run build
      - name: Install browser test dependency
        run: npx playwright install --with-deps chromium
      - name: Frontend browser test
        run: npm run test:e2e

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy apps config packages scripts src tests
      - name: Tests and coverage
        run: python -m pytest --cov --cov-report=term-missing
      - name: Offline AI evaluation gate
        # Deterministic and credential-free: scripted model, hashing embedder,
        # real guards. Fails on critical safety checks, regressions, or drift.
        run: python -m scripts.run_evaluations --output evals/results/latest.json
      - name: Dependency license policy
        # Python (installed lock) and npm (package-lock.json) licenses against
        # security/license-policy.toml; see docs/security/license-policy.md.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m scripts.check_licenses
      - name: Verify and compatibility-check OpenAPI
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          OPENAPI_BREAK_OVERRIDE: ${{ vars.OPENAPI_BREAK_OVERRIDE }}
        run: |
          python -m scripts.generate_openapi
          git diff --exit-code -- openapi/openapi.json
          # No base, a new branch, or a force-push (for example a Dependabot rebase) whose
          # previous tip is no longer reachable: compare against the parent commit instead.
          if [ -z "${BASE_REF}" ] || echo "${BASE_REF}" | grep -Eq '^0+$' \
            || ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
            BASE_REF="HEAD^"
          fi
          python -m scripts.check_openapi_compatibility --base-ref "${BASE_REF}"
      - name: Upload evaluation report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-report
          path: evals/results/latest.json
          if-no-files-found: ignore

  pgvector:
    # Runs the document-index contract against a real PostgreSQL with pgvector. The default job matrix
    # skips these cases (no database); this job is where the pgvector backend is actually exercised.
    # The service image is a CI-only fixture; shipped images are digest-pinned separately.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d bi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGVECTOR_TEST_DSN: postgresql://ci:ci-only-password@127.0.0.1:5432/bi_ci
      POSTGRES_DSN: postgresql://ci:ci-only-password@127.0.0.1:5432/bi_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-postgres.txt
      - name: "Apply and verify the schema (applied twice to prove idempotence)"
        run: |
          python -m scripts.migrate_postgres
          python -m scripts.migrate_postgres
          python -m scripts.migrate_postgres --verify
      - name: Document index contract, migrations, and retrieval parity on pgvector
        run: python -m pytest tests/test_document_index_contract.py tests/test_pgvector_store.py -rs -v

  containers:
    # Builds the real images and exercises the Compose topology end to end. Runs in
    # LOCAL_ONLY_MODE, so it needs no credentials and never contacts a model provider.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOCAL_ONLY_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfiles
        run: |
          docker build --check -f Dockerfile.api .
          docker build --check -f Dockerfile.web .
      - name: Build images
        run: docker compose --profile streamlit build
      - name: Enforce image size budgets
        # Guards against regressions such as the multi-gigabyte CUDA PyTorch wheel.
        run: |
          api_bytes="$(docker image inspect conversational-bi/api:local --format '{{.Size}}')"
          web_bytes="$(docker image inspect conversational-bi/web:local --format '{{.Size}}')"
          echo "api image: ${api_bytes} bytes; web image: ${web_bytes} bytes"
          test "${api_bytes}" -lt 4500000000
          test "${web_bytes}" -lt 150000000
      # Policy and exception process: docs/security/image-scanning.md. The action is pinned to a
      # commit SHA (Dependabot's github-actions ecosystem keeps it current via the version comment).
      - name: SBOM for the API image (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: conversational-bi/api:local
          format: cyclonedx
          output: sbom-api.cdx.json
      - name: SBOM for the web image (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: conversational-bi/web:local
          format: cyclonedx
          output: sbom-web.cdx.json
      - name: Scan the API image (fixable HIGH and CRITICAL vulnerabilities fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: conversational-bi/api:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Scan the web image (fixable HIGH and CRITICAL vulnerabilities fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: conversational-bi/web:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-sboms
          path: sbom-*.cdx.json
          if-no-files-found: ignore
      - name: Start the stack (health-checked)
        run: docker compose up -d --wait --wait-timeout 300
      - name: Smoke test (journey, hardening, restart, audit persistence)
        run: python3 scripts/compose_smoke.py --compose --expect-local-only
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Browser journeys against the nginx image (also asserts no CSP violations)
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://127.0.0.1:8080 E2E_REAL_STACK=local npm run test:e2e
      - name: Backup and restore the audit log
        run: |
          sh ops/backup.sh backups
          archive="$(ls backups/audit-*.tar.gz | head -n 1)"
          sh ops/restore.sh "${archive}"
          python3 scripts/compose_smoke.py --expect-local-only
      - name: Streamlit compatibility profile
        run: docker compose --profile streamlit up -d --wait streamlit
      - name: Real browser PDF, citation, hybrid, and export journey with test-only providers
        run: |
          docker compose -f compose.yaml -f compose.e2e.yaml up -d --wait --wait-timeout 300 --force-recreate api web
          cd apps/web
          E2E_BASE_URL=http://127.0.0.1:8080 E2E_REAL_STACK=fake npx playwright test e2e/real-stack.spec.ts
      - name: Container logs
        if: failure()
        run: docker compose --profile streamlit logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose --profile streamlit down -v

  benchmarks:
    # Reports indicative timings only. Shared runners are noisy, so this job never gates a merge:
    # `continue-on-error` keeps the workflow green even if a benchmark cannot run. Compare the
    # uploaded report with docs/operations/benchmarks.md by eye; do not add thresholds here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Run benchmarks (non-blocking)
        run: |
          python -m scripts.run_benchmarks --output benchmark-results.json | tee benchmark-results.md
          cat benchmark-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: |
            benchmark-results.json
            benchmark-results.md
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependency vulnerability scan
        # PYSEC-2026-311, -3813, -3814, -3815 (chromadb) are all scoped to
        # chromadb's standalone HTTP server (its REST API auth/tenant model
        # and trust_remote_code model loading). This app only uses the
        # embedded chromadb.PersistentClient with no server and no
        # trust_remote_code, so they do not apply here. Re-check this
        # exception whenever chromadb is upgraded or its usage changes.
        run: |
          python -m pip install pip-audit
          python -m pip_audit --requirement requirements.lock --strict \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
