name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify generated API client
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Frontend lint
        run: npm run lint
      - name: Frontend type check
        run: npm run typecheck
      - name: Frontend unit tests
        run: npm run test
      - name: Frontend production build
        run: npm run build
      - name: Install browser test dependency
        run: npx playwright install --with-deps chromium
      - name: Frontend browser test
        run: npm run test:e2e

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy apps config packages scripts src tests
      - name: Tests and coverage
        run: python -m pytest --cov --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependency vulnerability scan
        # PYSEC-2026-311, -3813, -3814, -3815 (chromadb) are all scoped to
        # chromadb's standalone HTTP server (its REST API auth/tenant model
        # and trust_remote_code model loading). This app only uses the
        # embedded chromadb.PersistentClient with no server and no
        # trust_remote_code, so they do not apply here. Re-check this
        # exception whenever chromadb is upgraded or its usage changes.
        run: |
          python -m pip install pip-audit
          python -m pip_audit --requirement requirements.lock --strict \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
