name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify generated API client
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Frontend lint
        run: npm run lint
      - name: Frontend type check
        run: npm run typecheck
      - name: Frontend unit tests
        run: npm run test
      - name: Frontend production build
        run: npm run build
      - name: Install browser test dependency
        run: npx playwright install --with-deps chromium
      - name: Frontend browser test
        run: npm run test:e2e

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy apps config packages scripts src tests
      - name: Tests and coverage
        run: python -m pytest --cov --cov-report=term-missing
      - name: Offline AI evaluation gate
        # Deterministic and credential-free: scripted model, hashing embedder,
        # real guards. Fails on critical safety checks, regressions, or drift.
        run: python -m scripts.run_evaluations --output evals/results/latest.json
      - name: Upload evaluation report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: evals/results/latest.json
          if-no-files-found: ignore

  containers:
    # Builds the real images and exercises the Compose topology end to end. Runs in
    # LOCAL_ONLY_MODE, so it needs no credentials and never contacts a model provider.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOCAL_ONLY_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfiles
        run: |
          docker build --check -f Dockerfile.api .
          docker build --check -f Dockerfile.web .
      - name: Build images
        run: docker compose --profile streamlit build
      - name: Enforce image size budgets
        # Guards against regressions such as the multi-gigabyte CUDA PyTorch wheel.
        run: |
          api_bytes="$(docker image inspect conversational-bi/api:local --format '{{.Size}}')"
          web_bytes="$(docker image inspect conversational-bi/web:local --format '{{.Size}}')"
          echo "api image: ${api_bytes} bytes; web image: ${web_bytes} bytes"
          test "${api_bytes}" -lt 4500000000
          test "${web_bytes}" -lt 150000000
      - name: Start the stack (health-checked)
        run: docker compose up -d --wait --wait-timeout 300
      - name: Smoke test (journey, hardening, restart, audit persistence)
        run: python3 scripts/compose_smoke.py --compose --expect-local-only
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Browser journeys against the nginx image (also asserts no CSP violations)
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://127.0.0.1:8080 npm run test:e2e
      - name: Backup and restore the audit log
        run: |
          sh ops/backup.sh backups
          archive="$(ls backups/audit-*.tar.gz | head -n 1)"
          sh ops/restore.sh "${archive}"
          python3 scripts/compose_smoke.py --expect-local-only
      - name: Streamlit compatibility profile
        run: docker compose --profile streamlit up -d --wait streamlit
      - name: Container logs
        if: failure()
        run: docker compose --profile streamlit logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose --profile streamlit down -v

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependency vulnerability scan
        # PYSEC-2026-311, -3813, -3814, -3815 (chromadb) are all scoped to
        # chromadb's standalone HTTP server (its REST API auth/tenant model
        # and trust_remote_code model loading). This app only uses the
        # embedded chromadb.PersistentClient with no server and no
        # trust_remote_code, so they do not apply here. Re-check this
        # exception whenever chromadb is upgraded or its usage changes.
        run: |
          python -m pip install pip-audit
          python -m pip_audit --requirement requirements.lock --strict \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
