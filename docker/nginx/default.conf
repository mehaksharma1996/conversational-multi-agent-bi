# Static web shell plus a same-origin reverse proxy to the API.
#
# Runs as the unprivileged nginx user on port 8080 with a read-only root
# filesystem (temp files go to the /tmp tmpfs). The API is reached only through
# this proxy: /api and /health are forwarded, everything else is the SPA, so the
# FastAPI docs and OpenAPI document are not exposed to browsers.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the API through Docker's embedded DNS at request time (not just at
    # startup) so recreating the api container during an upgrade does not leave
    # this proxy pointing at a stale address, and nginx can start before the API.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream http://api:8000;

    # Upload limits: 50 MB tabular, 25 MB per PDF, 50 MB combined; leave room for
    # multipart framing. The API enforces the exact limits.
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers (declared once at server level; locations below must not
    # use add_header or nginx stops inheriting these).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Analysis, indexing, and PDF rendering can take a while on large inputs.
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri /index.html;
    }
}
