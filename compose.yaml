# Local, portable topology for the conversational BI workbench.
#
#   docker compose up -d --build --wait      # start (http://127.0.0.1:8080)
#   LOCAL_ONLY_MODE=true docker compose up -d --wait   # no data ever sent to Gemini
#   docker compose down                      # stop, keep data
#   docker compose down -v                   # stop and delete every volume (reset)
#
# Configuration comes from the environment or a local .env file (never baked into an
# image). Nothing here assumes a hosting platform. See docs/operations/local-containers.md.
#
# SECURITY: local mode uses a fixed development identity. OIDC bearer verification exists,
# but browser login, roles, CSRF/CORS, and logout are not complete, so the web port remains
# loopback-only. Do not expose it to a network until issue #9 is complete.

name: conversational-bi

x-hardened: &hardened
  init: true                       # PID 1 reaps children and forwards SIGTERM
  read_only: true                  # writable paths are explicit volumes and tmpfs
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-environment: &app-environment
  API_AUTH_MODE: ${API_AUTH_MODE:-local}
  OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
  OIDC_ALLOWED_ALGORITHMS: ${OIDC_ALLOWED_ALGORITHMS:-RS256}
  OIDC_CLOCK_SKEW_SECONDS: ${OIDC_CLOCK_SKEW_SECONDS:-60}
  OIDC_JWKS_CACHE_SECONDS: ${OIDC_JWKS_CACHE_SECONDS:-300}
  OIDC_HTTP_TIMEOUT_SECONDS: ${OIDC_HTTP_TIMEOUT_SECONDS:-5}
  OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
  WEB_ORIGIN: ${WEB_ORIGIN:-}
  API_SESSION_MAX_AGE_SECONDS: ${API_SESSION_MAX_AGE_SECONDS:-28800}
  API_SESSION_IDLE_TIMEOUT_SECONDS: ${API_SESSION_IDLE_TIMEOUT_SECONDS:-1800}
  OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-}
  OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid}
  LLM_PROVIDERS: ${LLM_PROVIDERS:-gemini}
  GEMINI_MODEL_FAST: ${GEMINI_MODEL_FAST:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
  ANTHROPIC_MODEL_FAST: ${ANTHROPIC_MODEL_FAST:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-}
  OLLAMA_MODEL_FAST: ${OLLAMA_MODEL_FAST:-}
  OLLAMA_TRUSTED_HOSTS: ${OLLAMA_TRUSTED_HOSTS:-}
  LLM_TIER_ROUTE: ${LLM_TIER_ROUTE:-fast}
  LLM_TIER_CRITERIA_EXTRACTION: ${LLM_TIER_CRITERIA_EXTRACTION:-fast}
  LLM_TIER_SQL_GENERATION: ${LLM_TIER_SQL_GENERATION:-strong}
  LLM_TIER_SQL_CORRECTION: ${LLM_TIER_SQL_CORRECTION:-strong}
  LLM_TIER_RAG_ANSWER: ${LLM_TIER_RAG_ANSWER:-strong}
  RETRIEVAL_HYBRID: ${RETRIEVAL_HYBRID:-true}
  RETRIEVAL_RERANKER_MODEL: ${RETRIEVAL_RERANKER_MODEL:-}
  RETRIEVAL_RERANKER_REVISION: ${RETRIEVAL_RERANKER_REVISION:-}
  LLM_INPUT_COST_PER_MILLION_USD: ${LLM_INPUT_COST_PER_MILLION_USD:-}
  LLM_OUTPUT_COST_PER_MILLION_USD: ${LLM_OUTPUT_COST_PER_MILLION_USD:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  LOCAL_ONLY_MODE: ${LOCAL_ONLY_MODE:-false}
  GEMINI_EXCLUDE_SAMPLE_VALUES: ${GEMINI_EXCLUDE_SAMPLE_VALUES:-false}
  DEBUG_LOG_RAW_CONTENT: ${DEBUG_LOG_RAW_CONTENT:-false}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
  RETRIEVAL_MAX_DISTANCE: ${RETRIEVAL_MAX_DISTANCE:-0.7}
  SESSION_RETENTION_HOURS: ${SESSION_RETENTION_HOURS:-24}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RATE_LIMIT_TABULAR_UPLOADS: ${RATE_LIMIT_TABULAR_UPLOADS:-60}
  RATE_LIMIT_DOCUMENT_INDEXES: ${RATE_LIMIT_DOCUMENT_INDEXES:-20}
  RATE_LIMIT_ANALYSES: ${RATE_LIMIT_ANALYSES:-60}
  RATE_LIMIT_MESSAGES: ${RATE_LIMIT_MESSAGES:-120}
  EMBEDDING_CACHE_MAX_ENTRIES: ${EMBEDDING_CACHE_MAX_ENTRIES:-10000}

services:
  api:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.api
    image: conversational-bi/api:local
    environment:
      <<: *app-environment
      # Workspaces, consent, and uploaded files survive a restart (ADR 0022). Directories that
      # no metadata row owns are removed at startup (single API process only).
      AUDIT_MAX_SEGMENT_BYTES: "67108864"  # rotate each tenant's audit file at 64 MiB
      DURABLE_METADATA: "true"
      SWEEP_ORPHANED_WORKSPACES: "true"
    volumes:
      - bi-data:/data       # per-workspace SQLite/Chroma files (short-lived)
      - bi-audit:/audit     # append-only audit log; back this up
      - bi-models:/models   # Hugging Face model cache (avoids re-downloading)
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    # Not published: the web service is the only entry point.
    expose:
      - "8000"

  web:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.web
    image: conversational-bi/web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    tmpfs:
      - /tmp

  # Optional compatibility UI: docker compose --profile streamlit up -d --wait
  streamlit:
    <<: *hardened
    profiles: ["streamlit"]
    build:
      context: .
      dockerfile: Dockerfile.api
    image: conversational-bi/api:local
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      <<: *app-environment
    volumes:
      - bi-data:/data
      - bi-models:/models
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  bi-data:
  bi-audit:
  bi-models:
