[project]
name = "conversational-multi-agent-bi"
version = "0.2.0"
description = "A session-isolated conversational BI workbench for tabular data and PDF guidance."
requires-python = ">=3.12,<3.15"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "data", "work", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "(^|/)(\\.venv|data|work|outputs)/"

[tool.coverage.run]
source = ["config", "packages", "src"]
omit = ["src/ui/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
